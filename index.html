<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Pro - Gerenciamento de Tarefas</title>
    
    <!-- Fontes e Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Container Principal -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-clipboard-list"></i>
                    <h1>Gerenciador de Tarefas - Xingu Contábil</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="filterBtn">
                        <i class="fas fa-filter"></i>
                        Filtros
                    </button>
                    <button class="btn btn-primary" id="addTaskBtn">
                        <i class="fas fa-plus"></i>
                        Nova Tarefa
                    </button>
                </div>
            </div>
        </header>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Barra de Pesquisa -->
            <div class="search-section">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar tarefas...">
                </div>
                <div class="view-options">
                    <button class="view-btn active" data-view="board">
                        <i class="fas fa-columns"></i>
                    </button>
                    <button class="view-btn" data-view="list">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <!-- Container com Quadro Kanban e Estatísticas -->
            <div class="board-stats-wrapper">
                <!-- Quadro Kanban -->
                <div class="kanban-container">
                    <div class="kanban-board" id="kanbanBoard">
                        <!-- As colunas serão geradas automaticamente -->
                    </div>
                </div>

                <!-- Estatísticas -->
                <div class="stats-sidebar">
                    <h3 class="stats-title">Estatísticas</h3>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-tasks"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-number" id="totalTasks">0</div>
                            <div class="stat-label">Total de Tarefas</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-number" id="completedTasks">0</div>
                            <div class="stat-label">Concluídas</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-number" id="pendingTasks">0</div>
                            <div class="stat-label">Pendentes</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Nova Tarefa -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nova Tarefa</h2>
                <button class="close-btn" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Título da Tarefa</label>
                    <input type="text" id="taskTitle" required placeholder="Digite o título da tarefa">
                </div>
                
                <div class="form-group">
                    <label for="taskDescription">Descrição</label>
                    <textarea id="taskDescription" rows="3" placeholder="Descreva a tarefa em detalhes (opcional)"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Prioridade</label>
                        <select id="taskPriority">
                            <option value="low">Baixa</option>
                            <option value="medium" selected>Média</option>
                            <option value="high">Alta</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskDueDate">Data de Vencimento</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="taskCategory">Categoria (Departamento Pessoal)</label>
                    <select id="taskCategory">
                        <option value="rescisao">Rescisão</option>
                        <option value="folha_pagamento">Folha de Pagamento</option>
                        <option value="recibos_avulsos">Recibos Avulsos</option>
                        <option value="consultar_debitos_ferias">Consultar Débitos / Férias</option>
                        <option value="consultar_saldo_fgts">Consultar Saldo FGTS</option>
                        <option value="registro">Registro</option>
                        <option value="custom">➕ Criar Nova Categoria</option>
                    </select>
                </div>
                
                <!-- Campo para criar nova categoria (oculto inicialmente) -->
                <div class="form-group" id="customCategoryGroup" style="display: none;">
                    <label for="customCategory">Nome da Nova Categoria</label>
                    <input type="text" id="customCategory" placeholder="Digite o nome da nova categoria">
                    <button type="button" class="btn btn-secondary btn-sm" id="cancelCustomCategory">Cancelar</button>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Tarefa</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Filtros -->
    <div class="modal" id="filterModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Filtros</h2>
                <button class="close-btn" id="closeFilterModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="filter-options">
                <div class="filter-group">
                    <label>Prioridade</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="high" class="priority-filter"> Alta</label>
                        <label><input type="checkbox" value="medium" class="priority-filter"> Média</label>
                        <label><input type="checkbox" value="low" class="priority-filter"> Baixa</label>
                    </div>
                </div>
                
                <div class="filter-group">
                    <label>Categoria</label>
                    <div class="checkbox-group" id="categoryFilterList">
                        <label><input type="checkbox" value="rescisao" class="category-filter"> Rescisão</label>
                        <label><input type="checkbox" value="folha_pagamento" class="category-filter"> Folha de Pagamento</label>
                        <label><input type="checkbox" value="recibos_avulsos" class="category-filter"> Recibos Avulsos</label>
                        <label><input type="checkbox" value="consultar_debitos_ferias" class="category-filter"> Consultar Débitos / Férias</label>
                        <label><input type="checkbox" value="consultar_saldo_fgts" class="category-filter"> Consultar Saldo FGTS</label>
                        <label><input type="checkbox" value="registro" class="category-filter"> Registro</label>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="clearFilters">Limpar Filtros</button>
                    <button type="button" class="btn btn-primary" id="applyFilters">Aplicar Filtros</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notificações Toast -->
    <div class="toast-container" id="toastContainer"></div>

        <!-- Font Awesome -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

        <!-- Firebase SDK -->
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

        <!-- JavaScript Principal -->
    <script src="js/app.js"></script>
</body>
</html>
